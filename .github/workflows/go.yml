name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          VERSION=${{ github.ref_name }}
          # Linux x86_64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X 'nixos_builds_manager/ui.Version=${VERSION}'" -o dist/nixos_builds_manager-linux-amd64 .
          # Linux ARM64
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X 'nixos_builds_manager/ui.Version=${VERSION}'" -o dist/nixos_builds_manager-linux-arm64 .
      
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
